services:
  - type: web
    name: chill-shooters-api
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci
    startCommand: npm run server
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
      - key: MONGODB_URI
        sync: false
      - key: AUTH_SECRET
        generateValue: true
      - key: DB_NAME
        value: chillshootersgamecenter
      - key: BREVO_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: TO_EMAIL
        value: support@chillshooters.com
      # Image uploads (announcements, GCash proofs, IDs). Without these the API
      # stores uploads in MongoDB instead, which works but is slower.
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      # Card payments. The frontend also needs VITE_STRIPE_PUBLISHABLE_KEY (Vercel).
      - key: STRIPE_SECRET_KEY
        sync: false
